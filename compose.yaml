name: nutrient-engine
services:
  app:
    build: .
    image: nutrient-engine:0.2.0
    ports:
      - "127.0.0.1:${APP_PORT:-3838}:3838"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3838/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  api:
    build: .
    image: nutrient-engine:0.2.0
    command: ["Rscript", "scripts/serve_api.R"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
