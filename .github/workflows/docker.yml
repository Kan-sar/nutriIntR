name: Docker reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build from clean source and run embedded tests
        run: docker compose build
      - name: Start dashboard and API
        run: docker compose up -d --wait --wait-timeout 120
      - name: Exercise both services
        run: |
          curl --fail --silent http://127.0.0.1:3838/ -o /tmp/dashboard.html
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent -H 'Content-Type: application/json' --data-binary @inst/extdata/example-clock.json http://127.0.0.1:8000/analyze -o /tmp/result.json
          python3 -c 'import json; r=json.load(open("/tmp/result.json")); assert len(r["events"]) == 4; assert len(r["interactions"]) == 12'
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
