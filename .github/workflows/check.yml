name: R project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Restore locked dependencies
        run: Rscript --vanilla scripts/restore_environment.R
      - name: Core tests
        run: Rscript tests/run_tests.R
      - name: Dashboard workflow tests
        run: Rscript tests/test_app.R
      - name: Selected nutrient food correlation tests
        run: Rscript tests/test_food.R
      - name: Generate demonstration outputs
        run: Rscript scripts/demo.R
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install jsonschema
      - name: Validate JSON contracts
        run: python tests/validate_schemas.py
      - name: Build R package
        run: R CMD build .
      - name: Check R package
        run: R CMD check --no-manual nutrientengine_0.3.0.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-package-check
          path: |
            reports/generated/
            nutrientengine.Rcheck/
